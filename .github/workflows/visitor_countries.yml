name: Update Visitor Countries

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Fetch visitor totals from MapMyVisitors
      run: python3 scripts/update_visitor_countries.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add _data/visitor_countries.json
        git commit -m "Automated update of visitor countries" || echo "No changes to commit"
        git push
